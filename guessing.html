<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>💎 NUMBER QUEST - Ultimate Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-item">
            <div class="top-bar-label">Best</div>
            <div class="top-bar-value" id="bestScore">∞</div>
        </div>
        <div class="top-bar-item">
            <div class="top-bar-label">Total Games</div>
            <div class="top-bar-value" id="totalGames">0</div>
        </div>
        <div class="top-bar-item">
            <div class="top-bar-label">Avg Tries</div>
            <div class="top-bar-value" id="avgScore">-</div>
        </div>
    </div>

    <div class="subtitle">🎯 ULTIMATE GAME 🎯</div>
    <h1>💎 Number Quest AS</h1>

    <div class="container">
        <h2>🎮 GUESS IT!</h2>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label">Current</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Range</div>
                <div class="stat-value">1-100</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Today</div>
                <div class="stat-value" id="todayGames">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Win %</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
        </div>

        <input type="text" id="guessInput" placeholder="Enter a number..." onkeypress="handleKeyPress(event)" autocomplete="off" inputmode="numeric">
        <button id="guessBtn" onclick="checkGuess()">🚀 GUESS!</button>
        <div id="message"></div>
        <button class="reset-btn" id="resetBtn" onclick="resetGame()" style="display: none;">🔄 PLAY AGAIN</button>

        <div class="difficulty-info" id="difficultyInfo"></div>
        <div class="high-score-box" id="highScoreBox" style="display: none;">
            <div class="high-score-label">🏆 New Personal Best!</div>
            <div class="high-score-value" id="newBestScore"></div>
        </div>

        <button class="clear-btn" onclick="clearData()">🗑️ Clear All Data</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
